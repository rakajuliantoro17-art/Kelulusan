name: HUMAS PostgreSQL Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/humas-postgres-integration.yml"
      - "src/humas/supabase/migrations/**"
      - "src/humas/tests/humas-*.sql"
      - "src/humas/tests/humas-*.test.js"
      - "src/server/api/humas.js"
      - "src/server/api/humas-alumni-public.js"
  pull_request:
    paths:
      - "src/humas/supabase/migrations/**"
      - "src/humas/tests/humas-*.sql"
      - "src/humas/tests/humas-*.test.js"
      - "src/server/api/humas.js"

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      HUMAS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pintuku_humas_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create isolated test database
        run: createdb -h localhost -U postgres pintuku_humas_test

      - name: Bootstrap local Supabase compatibility scaffold
        run: psql "$HUMAS_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f src/humas/tests/humas-local-bootstrap.sql

      - name: Apply HUMAS migrations in timestamp order
        run: |
          set -euo pipefail
          for migration in src/humas/supabase/migrations/202611*_humas_*.sql; do
            echo "Applying $migration"
            psql "$HUMAS_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run transactional workflow integration tests
        run: psql "$HUMAS_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f src/humas/tests/humas-local-integration.sql

      - name: Verify RLS and database privileges
        run: psql "$HUMAS_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f src/humas/tests/humas-local-security.sql

      - name: Run API and migration source tests
        run: node --test src/humas/tests/humas-api.test.js src/humas/tests/humas-alumni-public-api.test.js src/humas/tests/humas-migrations-static.test.js src/humas/tests/humas-permit-transactions.test.js src/humas/tests/humas-permit-public-intake.test.js
