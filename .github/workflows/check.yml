name: Project Check

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  project-check:
    name: Verify Integrated Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Required Core Files
        run: |
          test -f README.md
          test -f LICENSE
          test -f vercel.json
          test -d src/pintuku/dashboard
          test -f src/pintuku/dashboard/index.html
          test -f src/pintuku/dashboard/sarpras.html
          test -d src/pintuku/assets/css
          test -d src/pintuku/assets/js
          test -f src/pintuku/pwa/manifest.json
          test -f src/pintuku/pwa/sw.js
          test -d src/server/api
          test -d src/humas/scripts
          test -d src/humas/supabase/migrations
          test -d src/humas/tests
          test -d src/TU/scripts
          test -d src/TU/supabase/migrations
          test -d src/TU/tests
          test -f src/server/api/akademik.js
          test -f src/server/api/kesiswaan.js
          test -f src/server/api/humas.js
          test -f api/humas-notifications.js
          test -f src/pintuku/dashboard/humas-perizinan.html
          test -f src/pintuku/dashboard/humas-perizinan-public.html
          test -f src/pintuku/assets/css/humas-perizinan.css
          test -f src/pintuku/assets/js/humas-perizinan.js
          test -f src/pintuku/assets/js/humas-perizinan-public.js
          test -f src/server/api/humas-alumni-public.js
          test -f api/humas-alumni-public.js
          test -f api/humas.js
          test -f src/pintuku/dashboard/humas-kemitraan.html
          test -f src/pintuku/assets/css/humas-kemitraan.css
          test -f src/pintuku/assets/js/humas-kemitraan.js
          test -f src/pintuku/dashboard/humas-proposal.html
          test -f src/pintuku/assets/css/humas-proposal.css
          test -f src/pintuku/assets/js/humas-proposal.js
          test -f src/pintuku/dashboard/humas-alumni.html
          test -f src/pintuku/dashboard/humas-alumni-public.html
          test -f src/pintuku/assets/css/humas-alumni.css
          test -f src/pintuku/assets/css/humas-alumni-public.css
          test -f src/pintuku/assets/js/humas-alumni.js
          test -f src/pintuku/assets/js/humas-alumni-public.js
          test -d public/assets
          test -d src/akademik
          test -d src/kesiswaan
          test -d src/Sarpras
          test -d src/Sarpras/legacy/config
          test -d src/Sarpras/legacy/init
          test -d src/Sarpras/legacy/layouts
          test -d src/Sarpras/legacy/pages
          test -d src/Sarpras/legacy/router
          test -f src/akademik/dashboard/index.html
          test -d src/akademik/legacy-graduation
          test -f api/akademik.js
          test -f api/kesiswaan.js
          test ! -e assets
          test ! -e config
          test ! -e css
          test ! -e init
          test ! -e js
          test ! -e layouts
          test ! -e pages
          test ! -e router
          test ! -e sarpras
          test ! -e manifest.json
          test ! -e sw.js
          test ! -e scripts
          test ! -e supabase
          test ! -e tests
          echo "Core project structure OK"

      - name: Validate JSON Configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('src/pintuku/pwa/manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('src/akademik/manifest.json', 'utf8'))"
          echo "JSON configuration OK"

      - name: Check JavaScript Syntax
        run: |
          find src/server/api src/akademik/api src/akademik/js src/kesiswaan/api src/Sarpras -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check src/pintuku/assets/js/humas-kemitraan.js
          node --check src/pintuku/assets/js/humas-proposal.js
          node --check src/pintuku/assets/js/humas-alumni.js
          node --check src/pintuku/assets/js/humas-alumni-public.js
          node --check src/pintuku/assets/js/humas-perizinan.js
          node --check src/pintuku/assets/js/humas-perizinan-public.js
          node --check src/server/api/humas.js
          node --check src/server/api/tu.js
          node --check src/TU/server/auth.js
          node --check src/TU/tests/tu-bootstrap-static.test.js
          node --check api/tu.js
          node --check src/pintuku/assets/js/tu-auth.js
          node --check src/pintuku/assets/js/tu-login.js
          node --check src/pintuku/assets/js/sarpras-auth.js
          node --check src/pintuku/assets/js/sarpras-login.js
          node --check src/pintuku/assets/js/sarpras-data.js
          node --check src/server/api/sarpras-auth.js
          node --check src/pintuku/assets/js/tu-invite.js
          node --check src/pintuku/assets/js/tata-usaha-front-office.js
          node --check src/pintuku/assets/js/tata-usaha-lobby.js
          node --check src/TU/tests/tu-front-office-workflow.test.js
          node --check src/TU/tests/tu-invite-static.test.js
          node --check src/pintuku/assets/js/tata-usaha-access.js
          node --check api/humas-notifications.js
          node --check src/server/api/humas-alumni-public.js
          echo "JavaScript syntax OK"

      - name: Verify Academic API Source Contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const dispatcher = fs.readFileSync('src/server/api/akademik.js', 'utf8');
          const routes = [
            'kenaikan', 'kelulusan', 'nilai', 'kelas-list', 'kelas-summary',
            'stats', 'admin-auth', 'announcements', 'absensi',
            'absensi-rekap', 'absensi-students'
          ];
          for (const op of routes) {
            if (!dispatcher.includes(op)) throw new Error('Handler missing: ' + op);
          }
          if (!dispatcher.includes('../../akademik/api/')) {
            throw new Error('Academic dispatcher import base path is incorrect');
          }
          console.log('Academic API source contract OK');
          NODE

      - name: Verify Repository Root Policy
        run: |
          node <<'NODE'
          const fs = require('fs');
          // 'api' wajib ada di root: Vercel hanya mendaftarkan fungsi serverless dari /api root.
          // Isinya hanya shim tipis yang me-require src/server/api/*.
          const allowedDirs = new Set(['.git', '.github', 'src', 'docs', 'public', 'api']);
          const entries = fs.readdirSync('.').filter(name => fs.statSync(name).isDirectory());
          const unexpected = entries.filter(name => !allowedDirs.has(name));
          if (unexpected.length) throw new Error('Unexpected root directories: ' + unexpected.join(', '));
          console.log('Repository root policy OK');
          NODE

      # Harus setelah Root Policy: langkah ini membuat dist/ (di-ignore git) di root.
      - name: Build Static Output
        run: |
          node --check src/tools/build.js
          node src/tools/build.js
          test -f dist/src/pintuku/dashboard/tata-usaha-login.html
          test -f dist/src/pintuku/assets/css/tata-usaha-login.css
          test -f dist/src/pintuku/assets/js/tu-auth.js
          test -f dist/src/pintuku/assets/js/tu-login.js
          test -f dist/src/pintuku/dashboard/sarpras-login.html
          test -f dist/src/pintuku/assets/js/sarpras-auth.js
          test -f dist/src/pintuku/dashboard/tata-usaha-accept-invite.html
          test -f dist/src/pintuku/assets/css/tu-invite.css
          test -f dist/src/pintuku/assets/js/tu-invite.js
          test -f dist/src/pintuku/dashboard/tata-usaha-lobby.html
          test -f dist/src/pintuku/assets/css/tata-usaha-lobby.css
          test -f dist/src/pintuku/assets/js/tata-usaha-lobby.js
          test -f dist/src/pintuku/dashboard/index.html
          test -f dist/src/pintuku/dashboard/humas-kemitraan.html
          test -f dist/src/pintuku/assets/css/humas-kemitraan.css
          test -f dist/src/pintuku/assets/js/humas-kemitraan.js
          test -f dist/src/pintuku/dashboard/humas-proposal.html
          test -f dist/src/pintuku/assets/css/humas-proposal.css
          test -f dist/src/pintuku/assets/js/humas-proposal.js
          test -f dist/src/pintuku/dashboard/humas-alumni.html
          test -f dist/src/pintuku/dashboard/humas-alumni-public.html
          test -f dist/src/pintuku/dashboard/humas-perizinan.html
          test -f dist/src/pintuku/dashboard/humas-perizinan-public.html
          test -f dist/src/pintuku/assets/css/humas-perizinan.css
          test -f dist/src/pintuku/assets/js/humas-perizinan.js
          test -f dist/src/pintuku/assets/js/humas-perizinan-public.js
          test -f dist/src/pintuku/assets/css/humas-alumni.css
          test -f dist/src/pintuku/assets/css/humas-alumni-public.css
          test -f dist/src/pintuku/assets/js/humas-alumni.js
          test -f dist/src/pintuku/assets/js/humas-alumni-public.js
          test ! -e dist/src/server
          echo "Static output OK"

      - name: Run HUMAS permit and protocol source tests
        run: node --test src/humas/tests/humas-migrations-static.test.js src/humas/tests/humas-permit-transactions.test.js src/humas/tests/humas-permit-public-intake.test.js

      - name: Run TU authentication security tests
        run: node --test src/TU/tests/tu-auth-static.test.js

      - name: Run TU invitation acceptance security tests
        run: node --test src/TU/tests/tu-invite-static.test.js

      - name: Run TU Front Office workflow security tests
        run: node --test src/TU/tests/tu-front-office-workflow.test.js

      - name: Run TU Lobby display safety tests
        run: node --test src/TU/tests/tu-lobby-static.test.js

      - name: Run TU bootstrap security tests
        run: node --test src/TU/tests/tu-bootstrap-static.test.js

      - name: Success
        run: echo "Integrated project verification completed."
