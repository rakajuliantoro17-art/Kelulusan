<!DOCTYPE html>
<html lang="id">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>

SARPRASIN - Reset Password

</title>



<link rel="icon" href="/assets/logo/logo.png">



<link rel="stylesheet" href="/assets/css/main.css">

<link rel="stylesheet" href="/assets/css/pages/public.css">

<link rel="stylesheet" href="/assets/css/pages/reset-password.css">



</head>




<body>



<div class="reset-wrapper">







<!-- =============================
     BRAND
============================= -->


<section class="reset-brand">


<img

src="/assets/logo/logo.png"

alt="SARPRASIN"


>



<h1>

SARPRASIN

</h1>


<p>

Smart School Asset Management System

</p>



<span>

SMAN 1 Sooko Mojokerto

</span>


</section>









<!-- =============================
     CARD
============================= -->


<section class="reset-card">





<div class="reset-icon">

🔑

</div>





<h2>

Buat Password Baru

</h2>




<p>

Silakan masukkan password baru untuk akun Anda.

</p>









<form

id="resetForm"

>







<div class="form-group">


<label>

Password Baru

</label>



<input

type="password"

id="newPassword"

placeholder="Minimal 8 karakter"

required

>


</div>









<div class="form-group">


<label>

Konfirmasi Password

</label>



<input

type="password"

id="confirmPassword"

placeholder="Ulangi password"

required

>


</div>









<div class="password-strength">


<div

id="strengthBar"

>

</div>


<span

id="strengthText"

>

Kekuatan password

</span>


</div>









<button

type="submit"

id="resetButton"

>


Simpan Password


</button>







</form>









<div

id="resetMessage"

class="reset-message"

style="display:none"

>

</div>









<div class="reset-footer">


<a href="/public/login.html">

Kembali Login

</a>


</div>








</section>









<section class="security-note">


🔒 Password baru akan dienkripsi dan disimpan secara aman.


</section>








<footer>


<p>

© 2026 SMAN 1 Sooko Mojokerto

</p>


</footer>







</div>







<script

type="module"

src="/src/pages/public/reset-password.js"

></script>



</body>


</html>
