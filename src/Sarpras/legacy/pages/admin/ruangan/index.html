<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruangan | SARPRASIN</title>
    <link rel="icon" href="/logo/icon.png">
    <link rel="stylesheet" href="/src/assets/css/app.css">
</head>
<body>

    <div class="shell-loading" id="shellLoading">Memeriksa sesi login...</div>

    <!-- Isi halaman. Disembunyikan sampai login admin terverifikasi,
         lalu dipindahkan ke dalam layout sidebar oleh admin-shell.js -->
    <div id="pageContent" hidden>
        <div class="dashboard-title">
            <h2>Ruangan</h2>
            <span>Data ruang &amp; penanggung jawab (dasar Kartu Inventaris Ruangan)</span>
        </div>

        <div class="dashboard-panel glass">
            <div class="page-toolbar">
                <input type="search" id="searchInput" placeholder="Cari ruangan...">
                <button type="button" class="btn-primary" id="addBtn">➕ Tambah Ruangan</button>
            </div>
            <div class="page-toolbar"><span id="rowCount"></span></div>
            <div class="table-wrap">
                <table class="table dashboard-table">
                    <thead><tr>
                        <th>Kode</th><th>Nama Ruang</th><th>Jenis</th><th>Bangunan</th><th>Penanggung Jawab</th>
                        <th>Jml Barang</th><th>Aksi</th>
                    </tr></thead>
                    <tbody id="dataTable"><tr><td colspan="7" class="page-empty">Memuat data...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="/src/assets/js/pages/admin-ruangan.js"></script>
</body>
</html>
