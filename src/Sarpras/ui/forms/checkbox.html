<label
    class="checkbox"
    for="checkboxDefault">

    <!-- ==========================================
         Input
    =========================================== -->

    <input
        id="checkboxDefault"
        class="checkbox-input"
        type="checkbox"
        name="checkboxDefault"
        value="1">

    <!-- ==========================================
         Custom Checkbox
    =========================================== -->

    <span
        class="checkbox-control"
        aria-hidden="true">

        <svg
            class="checkbox-icon"
            viewBox="0 0 24 24"
            fill="none">

            <path
                d="M5 12L10 17L19 8"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"/>

        </svg>

    </span>

    <!-- ==========================================
         Content
    =========================================== -->

    <span class="checkbox-content">

        <span class="checkbox-label">

            Saya menyetujui ketentuan penggunaan

        </span>

        <span class="checkbox-description">

            Centang untuk melanjutkan proses.

        </span>

    </span>

</label>
