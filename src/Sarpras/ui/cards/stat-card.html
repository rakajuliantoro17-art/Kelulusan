<article
    id="statCard"
    class="glass-card stat-card"
    role="article"
    aria-labelledby="statCardTitle">

    <!-- ==========================================
         Header
    =========================================== -->

    <header class="stat-card-header">

        <div class="stat-card-info">

            <p
                id="statCardTitle"
                class="stat-card-label">

                Total Aset

            </p>

            <h2
                class="stat-card-value"
                data-value>

                1.254

            </h2>

        </div>

        <div
            class="stat-card-icon"
            aria-hidden="true">

            📦

        </div>

    </header>

    <!-- ==========================================
         Body
    =========================================== -->

    <section class="stat-card-body">

        <div class="stat-card-progress">

            <div
                class="stat-progress-bar">

                <div
                    class="stat-progress-fill"
                    style="width:78%;">

                </div>

            </div>

        </div>

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer class="stat-card-footer">

        <span
            class="stat-card-trend trend-up">

            ▲ +12%

        </span>

        <small
            class="stat-card-period">

            dibanding bulan lalu

        </small>

    </footer>

</article>
