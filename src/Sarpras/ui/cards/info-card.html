<article
    id="infoCard"
    class="glass-card info-card"
    role="article"
    aria-labelledby="infoCardTitle">

    <!-- ==========================================
         Header
    =========================================== -->

    <header class="info-card-header">

        <div class="info-card-meta">

            <div
                class="info-card-icon"
                aria-hidden="true">

                ℹ️

            </div>

            <div>

                <h3
                    id="infoCardTitle"
                    class="info-card-title">

                    Informasi Sistem

                </h3>

                <p
                    class="info-card-category">

                    Sistem • Hari ini

                </p>

            </div>

        </div>

        <span
            class="badge badge-info">

            Baru

        </span>

    </header>

    <!-- ==========================================
         Body
    =========================================== -->

    <section class="info-card-body">

        <p class="info-card-text">

            Seluruh data inventaris telah berhasil
            disinkronkan dengan database.

        </p>

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer class="info-card-footer">

        <small class="info-card-time">

            Diperbarui 2 menit yang lalu

        </small>

        <button
            type="button"
            class="btn btn-text">

            Lihat Detail →

        </button>

    </footer>

</article>
