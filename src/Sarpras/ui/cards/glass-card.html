<article
    id="glassCard"
    class="glass-card"
    role="region"
    aria-labelledby="glassCardTitle">

    <!-- ==========================================
         Header
    =========================================== -->

    <header class="glass-card-header">

        <div class="glass-card-title-group">

            <div
                class="glass-card-icon"
                aria-hidden="true">

                📊

            </div>

            <div>

                <h3
                    id="glassCardTitle"
                    class="glass-card-title">

                    Dashboard

                </h3>

                <p
                    class="glass-card-subtitle">

                    Ringkasan informasi

                </p>

            </div>

        </div>

        <!-- Header Actions -->

        <div class="glass-card-tools">

            <button
                class="btn btn-icon"
                type="button"
                aria-label="Refresh">

                🔄

            </button>

            <button
                class="btn btn-icon"
                type="button"
                aria-label="Menu">

                ⋮

            </button>

        </div>

    </header>

    <!-- ==========================================
         Body
    =========================================== -->

    <section
        class="glass-card-body">

        <p>

            Konten card ditampilkan di sini.

        </p>

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer
        class="glass-card-footer">

        <small>

            Terakhir diperbarui:
            Baru saja

        </small>

    </footer>

</article>
