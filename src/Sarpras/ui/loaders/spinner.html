<div
    id="spinnerLoader"
    class="spinner-loader"
    role="status"
    aria-live="polite"
    aria-busy="true">

    <!-- ==========================================
         Spinner
    =========================================== -->

    <div
        class="spinner-circle"
        aria-hidden="true">

    </div>

    <!-- ==========================================
         Message
    =========================================== -->

    <div class="spinner-content">

        <h3 class="spinner-title">

            Memuat Data

        </h3>

        <p class="spinner-message">

            Mohon tunggu sebentar...

        </p>

    </div>

    <!-- ==========================================
         Screen Reader
    =========================================== -->

    <span class="sr-only">

        Sedang memuat data.

    </span>

</div>
