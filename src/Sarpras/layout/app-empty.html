<section
    id="appEmpty"
    class="app-empty hidden"
    aria-live="polite">

    <div class="empty-card">

        <!-- ======================================
             Illustration
        ======================================= -->

        <div class="empty-illustration">

            <img
                src="/logo/icon.png"
                alt="Empty State"
                class="empty-logo">

        </div>

        <!-- ======================================
             Content
        ======================================= -->

        <div class="empty-content">

            <h2
                id="emptyTitle"
                class="empty-title">

                Belum Ada Data

            </h2>

            <p
                id="emptyMessage"
                class="empty-message">

                Data yang Anda cari belum tersedia atau belum pernah ditambahkan.

            </p>

        </div>

        <!-- ======================================
             Actions
        ======================================= -->

        <div class="empty-actions">

            <button
                id="emptyPrimaryButton"
                type="button"
                class="btn btn-primary">

                Tambah Data

            </button>

            <button
                id="emptySecondaryButton"
                type="button"
                class="btn btn-outline">

                Muat Ulang

            </button>

        </div>

    </div>

</section>
