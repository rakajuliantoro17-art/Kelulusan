<header
    id="appHeader"
    class="app-header"
    role="banner">

    <!-- ==========================================
         Brand
    =========================================== -->

    <div class="header-brand">

        <a
            href="/"
            class="header-logo-link"
            aria-label="Beranda Sarprasin">

            <img
                src="/logo/icon.png"
                alt="Logo Sarprasin"
                class="header-logo">

        </a>

        <div class="header-title">

            <h1>

                Sarprasin 2.0

            </h1>

            <span>

                Smart School Asset Management System

            </span>

        </div>

    </div>

    <!-- ==========================================
         School Identity
    =========================================== -->

    <div class="header-school">

        <strong id="schoolName">

            SMAN 1 Sooko Mojokerto

        </strong>

        <small id="schoolYear">

            Tahun Ajaran 2026/2027

        </small>

    </div>

</header>
