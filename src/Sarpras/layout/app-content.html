<a
    href="#contentContainer"
    class="skip-link">

    Lewati ke Konten

</a>

<div
    id="appContainer"
    class="app-container"
    data-theme="light"
    data-role="user">

    <!-- ==========================================
         Background
    =========================================== -->

    <div class="app-background"></div>

    <div class="app-overlay"></div>

    <!-- ==========================================
         Mobile Drawer Overlay
    =========================================== -->

    <div
        id="drawerOverlay"
        class="drawer-overlay hidden"></div>

    <!-- ==========================================
         Sidebar
    =========================================== -->

    <aside
        id="sidebarContainer"
        class="app-sidebar-container">

    </aside>

    <!-- ==========================================
         Main Area
    =========================================== -->

    <div class="app-main">

        <header
            id="topbarContainer"
            class="app-topbar-container">

        </header>

        <section
            id="breadcrumbContainer"
            class="app-breadcrumb-container">

        </section>

        <section
            id="toolbarContainer"
            class="app-toolbar-container">

        </section>

        <main
            id="contentContainer"
            class="app-content-container">

        </main>

        <footer
            id="footerContainer"
            class="app-footer-container">

        </footer>

    </div>

    <!-- ==========================================
         Floating Action Button
    =========================================== -->

    <div id="floatingButtonContainer"></div>

    <!-- ==========================================
         Scroll To Top
    =========================================== -->

    <div id="scrollTopContainer"></div>

    <!-- ==========================================
         Toast Notification
    =========================================== -->

    <div
        id="toastContainer"
        class="toast-container">

    </div>

    <!-- ==========================================
         Notification Panel
    =========================================== -->

    <div
        id="notificationContainer">

    </div>

    <!-- ==========================================
         Modal Container
    =========================================== -->

    <div
        id="modalContainer">

    </div>

    <!-- ==========================================
         Loading Overlay
    =========================================== -->

    <div
        id="loadingContainer">

    </div>

    <!-- ==========================================
         Offline Banner
    =========================================== -->

    <div
        id="offlineContainer">

    </div>

</div>
