<div

class="modal-overlay"

id="confirmModalOverlay"

>





<div

class="app-modal confirm-modal"

id="confirmModal"

role="alertdialog"

aria-modal="true"

>





<!-- =====================================
     HEADER
====================================== -->


<div class="modal-header">



<div>


<h2

class="modal-title"

id="confirmTitle"

>

Konfirmasi Tindakan

</h2>




<p

class="modal-subtitle"

id="confirmSubtitle"

>

Pastikan tindakan ini benar


</p>



</div>






<button

class="modal-close"

id="confirmModalClose"

aria-label="Close"

>

×

</button>




</div>









<!-- =====================================
     BODY
====================================== -->


<div class="modal-body">





<div class="confirm-icon">


⚠️


</div>






<h3

id="confirmMessage"

class="confirm-message"

>


Apakah Anda yakin ingin melanjutkan?


</h3>






<p

class="confirm-description"

id="confirmDescription"

>


Tindakan ini tidak dapat dibatalkan.


</p>





</div>









<!-- =====================================
     FOOTER
====================================== -->


<div class="modal-footer">



<button

class="btn-secondary"

id="confirmCancel"

>

Batal

</button>







<button

class="btn-danger"

id="confirmAction"

>

Ya, Lanjutkan

</button>




</div>






</div>





</div>
