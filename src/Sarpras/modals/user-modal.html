<div

class="modal-overlay"

id="userModalOverlay"

>





<div

class="app-modal user-modal"

id="userModal"

role="dialog"

aria-modal="true"

>





<!-- =====================================
     HEADER
====================================== -->


<div class="modal-header">


<div>


<h2

class="modal-title"

id="userModalTitle"

>

Tambah User

</h2>




<p

class="modal-subtitle"

>

Kelola pengguna dan hak akses sistem

</p>


</div>





<button

class="modal-close"

id="userModalClose"

>

×

</button>



</div>









<!-- =====================================
     BODY
====================================== -->


<div class="modal-body">






<form

id="userForm"

>








<!-- PROFILE -->


<section class="form-section">


<h3>

Informasi Pengguna

</h3>






<div class="form-grid">





<div class="form-group">


<label>

Nama Lengkap

</label>



<input

type="text"

id="userName"

placeholder="Nama pengguna"

>


</div>








<div class="form-group">


<label>

Username

</label>



<input

type="text"

id="userUsername"

placeholder="username"

>


</div>





</div>







<div class="form-grid">





<div class="form-group">


<label>

Email

</label>



<input

type="email"

id="userEmail"

placeholder="email@sekolah.id"

>


</div>







<div class="form-group">


<label>

Nomor HP

</label>



<input

type="tel"

id="userPhone"

placeholder="08xxxxxxxxxx"

>


</div>



</div>




</section>









<!-- ACCESS -->


<section class="form-section">


<h3>

Hak Akses

</h3>







<div class="form-grid">





<div class="form-group">


<label>

Role

</label>




<select

id="userRole"

>



<option value="superadmin">

Super Admin

</option>



<option value="admin">

Admin Sarpras

</option>



<option value="operator">

Operator Inventaris

</option>



<option value="technician">

Teknisi

</option>



<option value="viewer">

Viewer

</option>



</select>



</div>







<div class="form-group">


<label>

Status

</label>




<select

id="userStatus"

>


<option>

Aktif

</option>


<option>

Nonaktif

</option>


</select>




</div>



</div>





</section>









<!-- UNIT -->


<section class="form-section">


<h3>

Unit / Bagian

</h3>






<div class="form-group">


<label>

Penempatan

</label>




<select

id="userDepartment"

>


<option>

Sarpras

</option>


<option>

Tata Usaha

</option>


<option>

Laboratorium

</option>


<option>

IT

</option>


<option>

Pimpinan

</option>


</select>



</div>



</section>









<!-- PASSWORD -->


<section class="form-section">


<h3>

Keamanan

</h3>






<div class="form-grid">





<div class="form-group">


<label>

Password

</label>



<input

type="password"

id="userPassword"

placeholder="Password"

>


</div>







<div class="form-group">


<label>

Konfirmasi Password

</label>



<input

type="password"

id="userPasswordConfirm"

placeholder="Ulangi password"

>


</div>





</div>



</section>









</form>







</div>









<!-- =====================================
     FOOTER
====================================== -->


<div class="modal-footer">



<button

class="btn-secondary"

id="userCancel"

>

Batal

</button>







<button

class="btn-primary"

id="userSave"

>

Simpan User

</button>



</div>






</div>





</div>
