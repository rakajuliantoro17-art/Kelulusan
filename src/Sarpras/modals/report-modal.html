<div

class="modal-overlay"

id="reportModalOverlay"

>





<div

class="app-modal report-modal"

id="reportModal"

role="dialog"

aria-modal="true"

>





<!-- =====================================
     HEADER
====================================== -->


<div class="modal-header">


<div>


<h2

class="modal-title"

>

Generate Report

</h2>




<p

class="modal-subtitle"

>

Buat laporan sarana prasarana


</p>


</div>





<button

class="modal-close"

id="reportModalClose"

>

×

</button>



</div>









<!-- =====================================
     BODY
====================================== -->


<div class="modal-body">






<form

id="reportForm"

>






<!-- REPORT TYPE -->


<div class="form-section">


<h3>

Jenis Laporan

</h3>



<div class="form-group">


<label>

Pilih Laporan

</label>



<select

id="reportType"

>


<option value="asset">

Laporan Inventaris Asset

</option>



<option value="condition">

Kondisi Asset

</option>



<option value="maintenance">

Maintenance

</option>



<option value="audit">

Audit Log

</option>



<option value="kib">

Kartu Inventaris Barang

</option>



</select>


</div>



</div>









<!-- FILTER -->


<div class="form-section">


<h3>

Filter Data

</h3>




<div class="form-grid">



<div class="form-group">


<label>

Kategori

</label>



<select

id="reportCategory"

>


<option value="all">

Semua

</option>


<option>

Elektronik

</option>


<option>

Furniture

</option>


<option>

Bangunan

</option>


</select>


</div>







<div class="form-group">


<label>

Lokasi

</label>



<select

id="reportRoom"

>


<option value="all">

Semua Ruang

</option>


</select>


</div>




</div>





<div class="form-grid">



<div class="form-group">


<label>

Tanggal Mulai

</label>


<input

type="date"

id="reportStartDate"

>


</div>







<div class="form-group">


<label>

Tanggal Akhir

</label>


<input

type="date"

id="reportEndDate"

>


</div>



</div>





</div>









<!-- FORMAT -->


<div class="form-section">


<h3>

Format Output

</h3>





<div class="report-format">



<label>


<input

type="radio"

name="reportFormat"

value="pdf"

checked

>


📄 PDF


</label>




<label>


<input

type="radio"

name="reportFormat"

value="excel"

>


📊 Excel


</label>




</div>




</div>









<!-- PREVIEW -->


<div

class="report-preview"

id="reportPreview"

>


<h3>

Preview

</h3>




<div

class="preview-summary"

>


<div>

<span>

Total Asset

</span>


<strong

id="previewTotalAsset"

>

0

</strong>


</div>





<div>

<span>

Kondisi Baik

</span>


<strong

id="previewGoodAsset"

>

0

</strong>


</div>





<div>

<span>

Perlu Perbaikan

</span>


<strong

id="previewRepairAsset"

>

0

</strong>


</div>



</div>



</div>








</form>






</div>









<!-- =====================================
     FOOTER
====================================== -->


<div class="modal-footer">



<button

class="btn-secondary"

id="reportCancel"

>

Batal

</button>







<button

class="btn-primary"

id="generateReport"

>

Generate Report

</button>



</div>






</div>





</div>
