<div

class="modal-overlay"

id="roomModalOverlay"

>





<div

class="app-modal room-modal"

id="roomModal"

role="dialog"

aria-modal="true"

>





<!-- =====================================
     HEADER
====================================== -->


<div class="modal-header">


<div>


<h2

class="modal-title"

id="roomModalTitle"

>

Tambah Ruang

</h2>




<p

class="modal-subtitle"

>

Kelola data lokasi aset


</p>


</div>





<button

class="modal-close"

id="roomModalClose"

>

×

</button>



</div>









<!-- =====================================
     BODY
====================================== -->


<div class="modal-body">






<form

id="roomForm"

>







<!-- IDENTITAS RUANG -->


<section class="form-section">


<h3>

Identitas Ruang

</h3>





<div class="form-grid">





<div class="form-group">


<label>

Kode Ruang

</label>


<input

type="text"

id="roomCode"

placeholder="LAB-01"

>


</div>







<div class="form-group">


<label>

Nama Ruang

</label>


<input

type="text"

id="roomName"

placeholder="Laboratorium Komputer 1"

>


</div>




</div>





</section>









<!-- DETAIL RUANG -->


<section class="form-section">


<h3>

Detail Fasilitas

</h3>







<div class="form-grid">



<div class="form-group">


<label>

Jenis Ruang

</label>



<select

id="roomType"

>


<option>

Kelas

</option>


<option>

Laboratorium

</option>


<option>

Perpustakaan

</option>


<option>

Kantor

</option>


<option>

Gudang

</option>


<option>

Fasilitas Umum

</option>


</select>


</div>







<div class="form-group">


<label>

Lantai

</label>



<input

type="number"

id="roomFloor"

placeholder="1"

>


</div>



</div>








<div class="form-grid">



<div class="form-group">


<label>

Kapasitas

</label>


<input

type="number"

id="roomCapacity"

placeholder="40"

>


</div>






<div class="form-group">


<label>

Status Ruang

</label>



<select

id="roomStatus"

>


<option>

Aktif

</option>


<option>

Renovasi

</option>


<option>

Tidak Digunakan

</option>


</select>



</div>



</div>



</section>









<!-- KONDISI -->


<section class="form-section">


<h3>

Kondisi Ruang

</h3>





<div class="form-group">


<label>

Deskripsi

</label>


<textarea

id="roomDescription"

placeholder="Catatan kondisi ruangan..."

></textarea>


</div>



</section>









<!-- FOTO RUANG -->


<section class="form-section">


<h3>

Dokumentasi

</h3>





<div

class="upload-area"

id="roomImageUpload"

>


<input

type="file"

id="roomImage"

accept="image/*"

hidden

>



<div>

📷

<br>

Upload Foto Ruang

</div>



</div>



</section>








</form>








</div>









<!-- =====================================
     FOOTER
====================================== -->


<div class="modal-footer">



<button

class="btn-secondary"

id="roomCancel"

>

Batal

</button>







<button

class="btn-primary"

id="roomSave"

>

Simpan Ruang

</button>



</div>






</div>





</div>
