<article class="card card-glass user-card">

    <!-- ==========================================
         Header
    =========================================== -->

    <header class="card-header">

        <div class="user-avatar">

            <img
                src="/public/images/avatar-default.png"
                alt="Foto Pengguna"
                loading="lazy">

        </div>

        <div class="user-header">

            <h3 class="card-title">

                Raka Aditya Juliantoro

            </h3>

            <p class="card-subtitle">

                Administrator Sarpras

            </p>

        </div>

        <span class="badge badge-success">

            Online

        </span>

    </header>

    <!-- ==========================================
         Body
    =========================================== -->

    <section class="card-body">

        <div class="user-info">

            <div class="user-info-item">

                <span class="label">
                    Email
                </span>

                <span class="value">
                    admin@sarprasin.id
                </span>

            </div>

            <div class="user-info-item">

                <span class="label">
                    Role
                </span>

                <span class="badge badge-primary">
                    Admin
                </span>

            </div>

            <div class="user-info-item">

                <span class="label">
                    Unit Kerja
                </span>

                <span class="value">
                    Sarana & Prasarana
                </span>

            </div>

            <div class="user-info-item">

                <span class="label">
                    Login Terakhir
                </span>

                <span class="value">
                    17 Juli 2026 • 18:45 WIB
                </span>

            </div>

        </div>

        <hr>

        <div class="user-statistics">

            <div class="user-stat">

                <strong>145</strong>

                <span>Aset Dikelola</span>

            </div>

            <div class="user-stat">

                <strong>28</strong>

                <span>Maintenance</span>

            </div>

            <div class="user-stat">

                <strong>96%</strong>

                <span>Validasi</span>

            </div>

        </div>

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer class="card-footer">

        <button class="btn btn-outline btn-sm">

            Profil

        </button>

        <button class="btn btn-primary btn-sm">

            Kelola Pengguna

        </button>

    </footer>

</article>
