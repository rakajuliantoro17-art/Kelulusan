<article class="card card-glass notification-card">

    <!-- ==========================================
         Header
    =========================================== -->

    <header class="card-header">

        <div>

            <span class="badge badge-danger">

                Notifikasi

            </span>

            <h3 class="card-title">

                Maintenance Prioritas Tinggi

            </h3>

        </div>

        <span class="badge badge-soft-danger">

            Baru

        </span>

    </header>

    <!-- ==========================================
         Body
    =========================================== -->

    <section class="card-body">

        <p class="notification-message">

            AC di Laboratorium Komputer 1 terdeteksi
            membutuhkan tindakan segera berdasarkan jadwal
            maintenance dan riwayat penggunaan.

        </p>

        <div class="notification-meta">

            <div class="notification-item">

                <span class="label">
                    Kategori
                </span>

                <span class="value">
                    Maintenance
                </span>

            </div>

            <div class="notification-item">

                <span class="label">
                    Prioritas
                </span>

                <span class="badge badge-danger">

                    Tinggi

                </span>

            </div>

            <div class="notification-item">

                <span class="label">
                    Waktu
                </span>

                <span class="value">
                    17 Juli 2026 • 19:00 WIB
                </span>

            </div>

        </div>

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer class="card-footer">

        <button class="btn btn-outline btn-sm">

            Tandai Dibaca

        </button>

        <button class="btn btn-primary btn-sm">

            Buka Detail

        </button>

    </footer>

</article>
