<article class="card card-glass asset-card">

    <!-- ======================================================
         Asset Image
    ======================================================= -->

    <div class="asset-card-image">

        <img
            src="/public/images/no-image.png"
            alt="Foto Aset"
            loading="lazy">

        <span class="badge badge-success asset-status">
            Aktif
        </span>

    </div>

    <!-- ======================================================
         Asset Body
    ======================================================= -->

    <div class="card-body">

        <div class="asset-category">

            <span class="badge badge-soft-primary">
                Komputer
            </span>

        </div>

        <h3 class="asset-name">

            Lenovo ThinkCentre M720

        </h3>

        <p class="asset-code">

            Kode :
            <strong>AST-2026-000123</strong>

        </p>

        <div class="asset-info">

            <div class="asset-info-item">

                <span class="label">
                    Lokasi
                </span>

                <span class="value">
                    Lab Komputer 1
                </span>

            </div>

            <div class="asset-info-item">

                <span class="label">
                    Penanggung Jawab
                </span>

                <span class="value">
                    Waka Sarpras
                </span>

            </div>

            <div class="asset-info-item">

                <span class="label">
                    Kondisi
                </span>

                <span class="value text-success">
                    Sangat Baik
                </span>

            </div>

            <div class="asset-info-item">

                <span class="label">
                    Tahun
                </span>

                <span class="value">
                    2025
                </span>

            </div>

        </div>

    </div>

    <!-- ======================================================
         Footer
    ======================================================= -->

    <div class="card-footer">

        <button class="btn btn-outline btn-sm">

            Detail

        </button>

        <button class="btn btn-warning btn-sm">

            Edit

        </button>

        <button class="btn btn-danger btn-sm">

            Hapus

        </button>

    </div>

</article>
