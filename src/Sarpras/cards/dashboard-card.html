<article class="card card-glass dashboard-card">

    <!-- ==========================================
         Header
    =========================================== -->

    <header class="card-header">

        <div>

            <h3 class="card-title">

                Dashboard Widget

            </h3>

            <p class="card-subtitle">

                Informasi terbaru sistem

            </p>

        </div>

        <div class="dashboard-card-actions">

            <button
                class="btn btn-icon btn-ghost"
                title="Refresh">

                ↻

            </button>

        </div>

    </header>

    <!-- ==========================================
         Body
    =========================================== -->

    <section class="card-body">

        <div class="dashboard-card-content">

            <p>

                Konten dashboard akan ditampilkan di sini.

            </p>

        </div>

    </section>

    <!-- ==========================================
         Footer
    =========================================== -->

    <footer class="card-footer">

        <span class="dashboard-card-time">

            Terakhir diperbarui :
            <strong>17 Juli 2026 • 19:00 WIB</strong>

        </span>

        <button class="btn btn-outline btn-sm">

            Lihat Detail

        </button>

    </footer>

</article>
