<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="description" content="Login staf Sarpras PINTUKU — SMAN 1 Sooko Mojokerto.">
<script>try{var t=localStorage.getItem("pintuku-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Masuk Sarpras · PINTUKU</title>
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/assets/shared/icons/favicon.ico">
<link rel="stylesheet" href="/css/portal-shell.css"><link rel="stylesheet" href="/css/tata-usaha-login.css"><link rel="stylesheet" href="/css/sarpras-workspace.css">
<script src="/js/sarpras-login.js" defer></script>
</head>
<body class="tu-login-page sp-login-page">
<main class="tu-login-shell">
 <a class="tu-login-brand" href="/sarpras" aria-label="Kembali ke portal Sarpras"><span class="tu-login-mark">SP</span><span><b>PINTUKU</b><small>Sarana &amp; Prasarana</small></span></a>
 <section class="tu-login-card">
  <span class="tu-login-kicker">SECURE WORKSPACE ACCESS</span>
  <h1>Masuk Sarpras.</h1>
  <p class="tu-login-intro">Masuk menggunakan akun yang diaktifkan oleh administrator Sarpras.</p>
  <div class="tu-login-alert" id="spLoginAlert" role="status" aria-live="polite" hidden></div>
  <form id="spLoginForm" novalidate>
   <label for="spUsername">Username akun</label>
   <input id="spUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" placeholder="Masukkan username" required>
   <div class="tu-password-label"><label for="spPassword">Kata sandi</label><button type="button" id="spTogglePassword" aria-pressed="false">Tampilkan</button></div>
   <input id="spPassword" name="password" type="password" autocomplete="current-password" maxlength="256" required>
   <button class="tu-login-submit" id="spLoginSubmit" type="submit"><span>Masuk</span><span aria-hidden="true">→</span></button>
  </form>
  <div class="tu-login-security"><span aria-hidden="true">◈</span><p>Sesi diverifikasi server melalui token bertanda tangan. Akses mengikuti peran pada tab Pengguna di spreadsheet Sarpras.</p></div>
 </section>
 <footer>SMAN 1 Sooko Mojokerto <span>·</span> PINTUKU</footer>
</main>
</body>
</html>
