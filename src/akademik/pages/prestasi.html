<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestasi Terkurasi Puspresnas | SMAN 1 Sooko Mojokerto</title>
<meta name="description" content="Rekap prestasi peserta didik SMAN 1 Sooko Mojokerto yang terkurasi Pusat Prestasi Nasional (Puspresnas), berdasarkan data SIMT Kemendikdasmen.">

<meta name="theme-color" content="#0F4C81">

<!-- ANTI-FLASH THEME INIT -->
<script>
    (function () {
        try {
            var saved = localStorage.getItem('smansasoo-theme');
            var theme = saved || ((window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>

<link rel="icon" href="../assets/logo/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/settings-drawer.css">
    <link rel="stylesheet" href="../css/stats-panel.css">
<link rel="stylesheet" href="../css/prestasi.css">

</head>
<body class="prestasi-page" data-page="prestasi">

    <!-- Foto background (blur ringan ~10%), lihat
         .prestasi-bg-layer di css/prestasi.css. -->
    <div class="prestasi-bg-layer" aria-hidden="true"></div>

    <!-- ================= SHELL: NAVBAR + SIDEBAR =================
         Markup diisi js/shell.js (lihat docs/UI-SHELL.md). Daftar
         "Di Halaman Ini" & link SIMT di bawah dibaca shell.js lewat
         window.SHELL_PAGE_SECTIONS / window.SHELL_EXTERNAL_LINK. -->

    <script>
        window.SHELL_PAGE_SECTIONS = [
            { id: "sekolah", label: "Ringkasan Sekolah", icon: "🏫" },
            { id: "peringkat", label: "Peringkat Nasional", icon: "🥇" },
            { id: "kategori", label: "Kategori Prestasi", icon: "📂" },
            { id: "per-tahun", label: "Per Tahun", icon: "📅" },
            { id: "siswa", label: "Siswa Berprestasi", icon: "👤" }
        ];
        window.SHELL_EXTERNAL_LINK = {
            href: "https://simt.kemendikdasmen.go.id/detail-prestasi-sekolah?npsn=20502727",
            label: "Buka Data Resmi di SIMT"
        };
    </script>

    <div id="shellNav"></div>

    <!-- ================= KONTEN ================= -->

    <div class="prestasi-hero app-fullbleed">

        <h1>Prestasi Terkurasi Puspresnas</h1>

        <p>Peta persebaran prestasi peserta didik, berdasarkan data SIMT Kemendikdasmen</p>

    </div>

    <main class="prestasi-shell-inner">

        <div id="prestasiRoot">

            <div class="prestasi-loading">Memuat data prestasi...</div>

        </div>

    </main>

    <footer class="prestasi-footer app-fullbleed">
        Data ditampilkan berdasarkan pencatatan manual dari
        <a href="https://simt.kemendikdasmen.go.id/detail-prestasi-sekolah?npsn=20502727" target="_blank" rel="noopener">SIMT Puspresnas</a>
        &middot; NPSN 20502727
    </footer>

    <div id="shellFooter"></div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/shell.js"></script>

    <!-- STATISTIK PENGUNJUNG (panel floating di sidebar) -->
    <script src="../js/stats-tracker.js"></script>
    <script src="../js/stats-panel.js"></script>

    <!-- TEMA (dark/light) + DRAWER PENGATURAN -->
    <script src="../js/theme.js"></script>
    <script src="../js/settings-drawer.js"></script>

    <script src="../js/prestasi.js"></script>

</body>
