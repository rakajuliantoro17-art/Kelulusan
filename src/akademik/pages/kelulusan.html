<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cek Pengumuman Kelulusan — SMAN 1 Sooko Mojokerto</title>
<meta name="description" content="Portal resmi pengumuman kelulusan SMAN 1 Sooko Mojokerto. Masukkan NIS atau NISN untuk melihat hasil kelulusan Anda.">

<meta name="theme-color" content="#071A35">

<!-- ANTI-FLASH THEME INIT -->
<script>
    (function () {
        try {
            var saved = localStorage.getItem('smansasoo-theme');
            var theme = saved || ((window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>

<link rel="icon" href="../assets/logo/favicon.ico">
<link rel="apple-touch-icon" href="../assets/icons/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- ==========================================================
     CSS KHUSUS HALAMAN INI.
     Sengaja TIDAK memakai ../css/variables.css, style.css, dst
     milik situs utama (kenaikan kelas/nilai/rekap) -- halaman
     Kelulusan punya set CSS-nya sendiri di css/kelulusan/,
     supaya perubahan di salah satu tidak saling mempengaruhi.
========================================================== -->

<link rel="stylesheet" href="../css/kelulusan/variables.css">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/kelulusan/style.css">
<link rel="stylesheet" href="../css/kelulusan/glass.css">
<link rel="stylesheet" href="../css/kelulusan/animation.css">
<link rel="stylesheet" href="../css/kelulusan/responsive.css">

<!-- Shell (nav + footer bersama, lihat docs/UI-SHELL.md).
     Aman dipakai di sini karena css/kelulusan/variables.css
     mendefinisikan token nama yang sama (--primary, --surface,
     dst) yang dipakai css/shell.css, jadi nav/footer otomatis
     ikut tema gelap halaman ini, bukan tema biru situs utama. -->
<link rel="stylesheet" href="../css/shell.css">

<!-- Cetak/Unduh PDF hasil (lihat js/print.js) -->
<link rel="stylesheet" href="../css/print.css">
<link rel="stylesheet" href="../css/settings-drawer.css">
    <link rel="stylesheet" href="../css/stats-panel.css">

</head>
<body data-page="kelulusan">

<!-- Shell: nav bar bersama (diisi js/shell.js, lihat docs/UI-SHELL.md) -->
<div id="shellNav"></div>

<div class="bg-layer" id="bgLayer"></div>

<div class="container">

    <header class="header">

        <img src="../assets/logo/logo.png" alt="Logo SMAN 1 Sooko Mojokerto" class="logo">

        <h1>SMAN 1 Sooko Mojokerto<span>Pengumuman Kelulusan</span></h1>

        <p>Masukkan NIS atau NISN untuk melihat hasil kelulusan Anda.</p>

    </header>

    <section class="search-section">

        <div class="search-card">

            <span class="badge-year" id="badgeYear"></span>
            <h2>Cek Hasil Kelulusan</h2>

            <form id="searchForm" autocomplete="off">

                <input
                    type="text"
                    id="keyword"
                    name="keyword"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                >

                <button type="submit">Lihat Hasil Kelulusan</button>

            </form>

        </div>

        <div id="result" class="hidden"></div>

    </section>

</div>

<!-- Shell: footer bersama (diisi js/shell.js, lihat docs/UI-SHELL.md) -->
<div id="shellFooter"></div>

<div class="flash" id="flash"></div>
<div id="balloons"></div>

<div class="overlay" id="overlay">
    <div class="result-box" id="overlayBox"></div>
</div>

<audio id="celebrationSound" preload="none"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- ==========================================================
     JS KHUSUS HALAMAN INI (namespace terpisah: window.CONFIG,
     window.API, window.UI, dst di sini HANYA berlaku selama
     halaman ini dimuat -- tidak bentrok dengan index.html /
     nilai.html / rekap.html karena masing-masing halaman
     dimuat di context browser yang berbeda).
========================================================== -->

<script src="../js/kelulusan/config.js"></script>
<script src="../js/kelulusan/utils.js"></script>

<!-- Shell (nav + footer bersama). Dimuat setelah config+utils
     di atas karena shell.js butuh window.CONFIG.SCHOOL_NAME/
     APP_NAME/VERSION dan Utils.getCurrentYear -- keduanya
     sudah disediakan oleh config.js & utils.js versi Kelulusan
     di atas, jadi TIDAK perlu memuat js/config.js atau
     js/utils.js (versi Kenaikan Kelas) di halaman ini. -->
<script src="../js/shell.js"></script>

    <!-- STATISTIK PENGUNJUNG (panel floating di sidebar) -->
    <script src="../js/stats-tracker.js"></script>
    <script src="../js/stats-panel.js"></script>

<!-- Cetak/Unduh PDF hasil -->
<script src="../js/print.js"></script>

<!-- TEMA (dark/light) + DRAWER PENGATURAN -->
<script src="../js/theme.js"></script>
<script src="../js/settings-drawer.js"></script>

<script src="../js/kelulusan/api.js"></script>
<script src="../js/kelulusan/ui.js"></script>
<script src="../js/kelulusan/search.js"></script>
<script src="../js/kelulusan/app.js"></script>

</body>
</html>
