<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman | SMAN 1 Sooko Mojokerto</title>
<meta name="description" content="Papan pengumuman resmi SMAN 1 Sooko Mojokerto.">

<meta name="theme-color" content="#0F4C81">

<!-- ANTI-FLASH THEME INIT -->
<script>
    (function () {
        try {
            var saved = localStorage.getItem('smansasoo-theme');
            var theme = saved || ((window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>

<link rel="icon" href="/akademik/assets/logo/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- CSS wajib di setiap halaman -->
<link rel="stylesheet" href="/akademik/css/variables.css">
<link rel="stylesheet" href="/akademik/css/theme.css">
<link rel="stylesheet" href="/akademik/css/style.css">
<link rel="stylesheet" href="/akademik/css/responsive.css">
<link rel="stylesheet" href="/akademik/css/glass.css">
<link rel="stylesheet" href="/akademik/css/animation.css">
<link rel="stylesheet" href="/akademik/css/shell.css">
<link rel="stylesheet" href="/akademik/css/settings-drawer.css">

<!-- CSS khusus halaman ini -->
<link rel="stylesheet" href="/akademik/css/pengumuman.css">

</head>

<body data-page="pengumuman">

    <!-- Foto background (blur), lihat css/glass.css. Gambarnya
         di-override ke assets/images/Skr.jpg khusus halaman ini
         lewat css/pengumuman.css (bukan ubah glass.css yang
         dipakai bersama halaman lain). -->
    <div class="bg-layer" aria-hidden="true"></div>

    <!-- ================= SHELL: NAVBAR + SIDEBAR ================= -->

    <div id="shellNav"></div>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container">

            <img src="/akademik/assets/logo/logo.png"
                 alt="Logo SMAN 1 Sooko"
                 class="logo">

            <h1>Papan<span>Pengumuman</span></h1>

            <p>Informasi resmi dari SMAN 1 Sooko Mojokerto</p>

        </div>

    </header>

    <!-- ================= KONTEN ================= -->

    <section class="container">

        <div id="pengumumanLoading" class="loading-box">
            <div class="spinner"></div>
            <p>Memuat pengumuman...</p>
        </div>

        <div id="pengumumanError" class="error-card hidden"></div>

        <div id="pengumumanContent" class="hidden">

            <div id="pengumumanList" class="pengumuman-list"></div>

        </div>

    </section>

    <div id="shellFooter"></div>

    <!-- CONFIG (wajib, dipakai Shell untuk nama sekolah & versi) -->
    <script src="/akademik/js/config.js"></script>

    <!-- UTILS (wajib) -->
    <script src="/akademik/js/utils.js"></script>

    <!-- SHELL (wajib, render nav + footer) -->
    <script src="/akademik/js/shell.js"></script>

    <!-- TEMA (dark/light) + DRAWER PENGATURAN -->
    <script src="/akademik/js/theme.js"></script>
    <script src="/akademik/js/settings-drawer.js"></script>

    <!-- Fitur Pengumuman -->
    <script src="/akademik/js/pengumuman-data.js"></script>
    <script src="/akademik/js/pengumuman-ui.js"></script>
    <script src="/akademik/js/pengumuman-app.js"></script>

</body>
</html>
