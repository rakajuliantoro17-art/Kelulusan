<!DOCTYPE html>
<html lang="id">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>

SARPRASIN - Registrasi Akun

</title>



<link rel="icon" href="/assets/logo/logo.png">


<link rel="stylesheet" href="/assets/css/main.css">

<link rel="stylesheet" href="/assets/css/pages/login.css">

<link rel="stylesheet" href="/assets/css/pages/register.css">


</head>



<body>




<div class="register-wrapper">







<!-- ==========================
     BRAND
========================== -->


<section class="register-brand">


<img

src="/assets/logo/logo.png"

alt="SARPRASIN"


>



<h1>

SARPRASIN

</h1>



<p>

Smart School Asset Management System

</p>



<span>

SMAN 1 Sooko Mojokerto

</span>


</section>









<!-- ==========================
     FORM CARD
========================== -->


<section class="register-card">





<div class="register-icon">

📝

</div>





<h2>

Buat Akun Baru

</h2>



<p>

Daftarkan akun untuk menggunakan layanan SARPRASIN.

</p>









<form

id="registerForm"

>







<div class="form-group">


<label>

Nama Lengkap

</label>



<input

type="text"

id="fullname"

placeholder="Nama pengguna"

required

>


</div>









<div class="form-group">


<label>

Email Sekolah

</label>



<input

type="email"

id="email"

placeholder="nama@sman1sooko.sch.id"

required

>


</div>









<div class="form-group">


<label>

Nomor WhatsApp

</label>



<input

type="tel"

id="phone"

placeholder="08xxxxxxxxxx"

>


</div>









<div class="form-group">


<label>

Jabatan / Unit

</label>



<select

id="position"

required

>


<option value="">

Pilih

</option>


<option>

Guru

</option>


<option>

Staff Tata Usaha

</option>


<option>

Laboran

</option>


<option>

Teknisi

</option>


<option>

Lainnya

</option>


</select>


</div>









<div class="form-group">


<label>

Password

</label>



<input

type="password"

id="password"

placeholder="Minimal 8 karakter"

required

>


</div>









<div class="form-group">


<label>

Konfirmasi Password

</label>



<input

type="password"

id="confirmPassword"

placeholder="Ulangi password"

required

>


</div>









<!-- ROLE DEFAULT -->


<input

type="hidden"

id="role"

value="staff"

>









<button

type="submit"

class="register-button"

id="registerButton"

>


Daftar Akun


</button>





</form>









<!-- MESSAGE -->


<div

id="registerMessage"

class="register-message"

style="display:none"

>

</div>









<div class="register-footer">


<p>

Sudah punya akun?

</p>



<a href="/public/login.html">

Login Sekarang

</a>


</div>







</section>









<!-- SECURITY -->


<section class="register-security">


🔒

Akun baru membutuhkan persetujuan administrator sebelum aktif.


</section>









<footer>


<p>

© 2026 SMAN 1 Sooko Mojokerto

</p>


</footer>







</div>






<script

type="module"

src="/src/pages/public/register.js"

></script>



</body>


</html>
