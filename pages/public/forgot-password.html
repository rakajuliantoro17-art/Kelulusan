<!DOCTYPE html>
<html lang="id">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>

SARPRASIN - Lupa Password

</title>




<link rel="icon" href="/assets/logo/logo.png">



<link rel="stylesheet" href="/assets/css/main.css">

<link rel="stylesheet" href="/assets/css/pages/public.css">

<link rel="stylesheet" href="/assets/css/pages/login.css">



</head>



<body>



<div class="auth-container">







<!-- =====================================
     LOGO
====================================== -->


<div class="auth-brand">


<img

src="/assets/logo/logo.png"

alt="SMAN 1 Sooko"

class="auth-logo"

>



<h1>

SARPRASIN

</h1>



<p>

Smart School Asset Management System

</p>


</div>









<!-- =====================================
     CARD
====================================== -->


<div class="auth-card">





<div class="auth-icon">

🔐

</div>






<h2>

Lupa Password

</h2>




<p class="auth-description">

Masukkan email akun Anda untuk menerima link reset password.

</p>









<!-- =====================================
     FORM
====================================== -->


<form

id="forgotPasswordForm"

>





<div class="form-group">


<label>

Email

</label>




<input

type="email"

id="resetEmail"

placeholder="nama@email.com"

required

autocomplete="email"


>


</div>









<button

type="submit"

class="auth-button"

id="resetButton"

>


Kirim Link Reset


</button>






</form>









<!-- =====================================
     MESSAGE
====================================== -->


<div

id="resetMessage"

class="auth-message"

style="display:none"

>

</div>









<!-- =====================================
     BACK LOGIN
====================================== -->


<div class="auth-footer">


<a

href="/pages/login/index.html"

>

← Kembali ke Login

</a>


</div>






</div>







</div>









<script

type="module"

src="/src/pages/public/forgot-password.js"

></script>



</body>


</html>
