<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SARPRASIN</title>
    <link rel="icon" href="/logo/icon.png">
    <link rel="stylesheet" href="/src/assets/css/app.css">
</head>
<body>

    <div class="shell-loading" id="shellLoading">Memeriksa sesi login...</div>

    <!-- Isi halaman. Disembunyikan sampai login admin terverifikasi,
         lalu dipindahkan ke dalam layout sidebar oleh admin-shell.js -->
    <div id="pageContent" hidden>
        <div class="dashboard-title">
            <h2>Dashboard</h2>
            <span id="dashboardDate"></span>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-stat glass"><div class="stat-icon">📦</div><span>Total Asset</span><h2 id="totalAsset">0</h2></div>
            <div class="dashboard-stat glass"><div class="stat-icon">🏫</div><span>Ruangan</span><h2 id="totalRoom">0</h2></div>
            <div class="dashboard-stat glass"><div class="stat-icon">🔧</div><span>Maintenance</span><h2 id="totalMaintenance">0</h2></div>
            <div class="dashboard-stat glass"><div class="stat-icon">📄</div><span>Laporan</span><h2 id="totalReport">0</h2></div>
        </div>

        <div class="dashboard-content-grid">
            <div class="dashboard-panel glass">
                <div class="dashboard-title"><h2>Aktivitas Terbaru</h2></div>
                <div class="table-wrap">
                <table class="table dashboard-table">
                    <thead><tr><th>User</th><th>Aktivitas</th><th>Waktu</th></tr></thead>
                    <tbody id="activityTable"></tbody>
                </table>
                </div>
            </div>

            <div class="dashboard-panel glass">
                <div class="dashboard-title"><h2>Quick Actions</h2></div>
                <div class="quick-actions">
                    <a class="quick-action" href="/admin/asset">➕ Kelola Asset</a>
                    <a class="quick-action" href="/admin/users">👤 Kelola User</a>
                    <a class="quick-action" href="/admin/laporan">📊 Laporan</a>
                </div>
                <div class="dashboard-title" style="margin-top:20px;"><h2 style="font-size:1rem;">Status Sistem</h2></div>
                <p id="systemStatus">Memeriksa status...</p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/assets/js/pages/admin.js"></script>
</body>
</html>
