<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="icon" href="/logo/icon.png">

<body>

    <div class="shell-loading" id="shellLoading">Memeriksa sesi login...</div>

    <!-- Isi halaman. Disembunyikan sampai login admin terverifikasi,

        <div class="dashboard-title">
            <h2>Maintenance</h2>
